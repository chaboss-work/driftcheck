[project]
name = "driftcheck"
version = "0.1.0"
description = "An OpenMinion agent that checks that docs still match the installed code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["openminion==0.1.20", "httpx>=0.27", "pydantic>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
driftcheck = "driftcheck.__main__:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["driftcheck"]
